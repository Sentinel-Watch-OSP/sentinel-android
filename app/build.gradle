apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// KSP replaces kotlin-kapt: kapt cannot run on JDK 25+ because it reaches into
// com.sun.tools.javac internals that newer JDKs no longer export. Room is the
// only annotation processor in this project and it supports KSP natively.
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'

android {
    compileSdkVersion 35
    flavorDimensions "versionCode"
    defaultConfig {
        applicationId "com.samourai.sentinel"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 56
        versionName '5.2.0'
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        applicationVariants.all { variant ->
            variant.buildConfigField "String", "XOR_1", "\"" + getApiKey("XOR_1") + "\""
            variant.buildConfigField "String", "XOR_2", "\"" + getApiKey("XOR_2") + "\""
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', '/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1', 'META-INF/proguard/androidx-annotations.pro', '/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1', 'META-INF/proguard/androidx-annotations.pro', 'META-INF/kotlinx_coroutines_core.version']        }
    }
    productFlavors {
        production {
            minSdkVersion 21
            applicationId 'com.samourai.sentinel'
            targetSdkVersion 33
            versionCode 56
            versionName '5.2.0'
            resValue "string", "app_name", "Sentinel"
            resValue "string", "version_name", "5.2.0"
        }
        staging {
            applicationId 'com.samourai.sentinel.staging'
            targetSdkVersion 33
            versionCode 56
            versionName '5.2.0'
            resValue "string", "app_name", "Sentinel staging"
            resValue "string", "version_name", "5.2.0"
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    //Migrating from Kotlin synthetics to Jetpack view binding
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    namespace 'com.samourai.sentinel'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.preference:preference:1.2.1'
    def lifecycle_version = "2.2.0"
    def coroutines_version = '1.10.2'
    def koin_version = '2.1.6'
    def topl_android_version = "2.1.2"
    def room_version = "2.7.2"
    def paging_version = "2.1.2"

    // for tor dependency (kmp-tor 2.x; resource 409.x = tor 0.4.9.x)
    def kmpTorRuntime = '2.6.0'
    def kmpTorResource = '409.5.0'

    configurations.all {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    implementation (project(':bitcoinj'))

    implementation (project(':extlibj')) {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'net.jcip', module: 'jcip-annotations'
        exclude group: 'com.squareup.okhttp', module: 'okhttp'
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'org.json', module: 'json'
    }
    implementation project(':boltzmann-java')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.google.guava:guava:24.1-jre'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.android.material:material:1.4.0-beta01'
    implementation('com.google.zxing:core:3.4.1') {
        transitive = true
    }

    implementation 'info.guardianproject:jtorctl:0.4.5.7'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // AndroidX libs
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.activity:activity-compose:1.5.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "androidx.core:core-ktx:1.3.2"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation "androidx.preference:preference-ktx:1.1.1"
    implementation "androidx.webkit:webkit:1.4.0"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.paging:paging-runtime-ktx:$paging_version" // For Kotlin use paging-runtime-ktx
    implementation "androidx.room:room-rxjava2:$room_version"

    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-viewmodel:$koin_version"
    implementation "io.insert-koin:koin-androidx-ext:$koin_version"


    //Test Libs
    testImplementation "junit:junit:4.13.2"
    // The android.jar used for unit tests stubs org.json to throw
    // "not mocked", so tests that parse JSON need the real implementation.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // tor dependency
    implementation "io.matthewnelson.kmp-tor:runtime:$kmpTorRuntime"
    implementation "io.matthewnelson.kmp-tor:runtime-service:$kmpTorRuntime"
    implementation "io.matthewnelson.kmp-tor:resource-exec-tor:$kmpTorResource"
    implementation (project(':hummingbird-android'))
    implementation ('com.sparrowwallet:hummingbird:1.6.6')
    implementation "com.mikepenz:itemanimators:1.1.0"
}
repositories {
    mavenCentral()
}


def getApiKey(key) {
    def Properties props = new Properties()
//    props.load(new FileInputStream(new File('samourai.api')))
    return props[key]
}

// Define publish tasks for each module
tasks.register("publishAllModules") {
    group = "publishing"
    description = "Publishes all configured modules to Maven"

    dependsOn ":bitcoinj:publish"
    dependsOn ":extlibj:publish"
    dependsOn ":boltzmann-java:publish"
    //dependsOn ":whirlpool-client:publish"
    dependsOn ":xmanager-protocol:publish"
    //dependsOn ":soroban-client-java:publish"
    //dependsOn ":whirlpool-protocol:publish"

    doLast {
        println("All modules have been published.")
    }
}