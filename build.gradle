// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.2.21'
        compose_version =  '1.5.3'
        koin_version = '3.0.1'
        // KSP's version prefix must match kotlin_version exactly.
        ksp_version = '2.2.21-2.0.4'
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // in the individual module build.gradle files
    }
}

// KSP replaces kapt for Room annotation processing. kapt shells out to javac
// internals (com.sun.tools.javac.*) that JDK 25+ no longer exports, which made
// the build fail on modern JDKs. KSP does not, so the project builds on any
// JDK from 17 upward.
plugins {
    id 'com.google.devtools.ksp' version "$ksp_version" apply false
}

rootProject.allprojects {
    repositories {
        maven {
            url "https://raw.githubusercontent.com/guardianproject/gpmaven/master"
        }
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
